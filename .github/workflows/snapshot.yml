name: Snapshot
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ github.event.workflow_run.conclusion == 'success' && contains(fromJSON('["push","schedule"]'), github.event.workflow_run.event) && github.event.workflow_run.head_sha == github.sha }}
    env:
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Configure Sonatype credentials
        run: |
          mkdir -p ~/.sbt/1.0
          cat > ~/.sbt/1.0/sonatype_credentials <<EOF
          realm=Sonatype Nexus Repository Manager
          host=central.sonatype.com
          user=$SONATYPE_USERNAME
          password=$SONATYPE_PASSWORD
          EOF
      - name: Import GPG key
        run: |
          echo "${{ secrets.PGP_SECRET }}" | base64 -d | gpg --batch --import
      - name: Publish Snapshot JAR
        run: |
          set -euo pipefail
          current_main_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [[ "$current_main_sha" != "$GITHUB_SHA" ]]; then
            echo "::notice::Skipping Snapshot publish because main has advanced."
            exit 0
          fi
          if git describe --exact-match --tags --match 'v[0-9]*' HEAD >/dev/null 2>&1; then
            echo "::notice::Skipping Snapshot publish because HEAD is a release tag."
            exit 0
          fi
          sbt \
            'set every publishTo := Some("central-snapshots" at "https://central.sonatype.com/repository/maven-snapshots/")' \
            +publishSigned
