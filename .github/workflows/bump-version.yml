name: Bump Version
on:
  workflow_dispatch:
    inputs:
      level:
        description: 'Version bump level'
        required: true
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      version:
        description: 'Explicit next version X.Y.Z (optional; overrides level)'
        required: false
        type: string
        default: ''
      force_bump:
        description: 'Force version bump'
        required: true
        type: boolean
        default: false
jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - name: Calculate changes from the latest tag to HEAD
        id: changes
        env:
          FORCE_BUMP: ${{ inputs.force_bump }}
          LEVEL: ${{ inputs.level }}
          VERSION: ${{ inputs.version }}
        run: |
          # version が指定されたときは level を無視し、検査に通れば何も計算せず 1 件とみなす。
          if [[ -n "$VERSION" ]]; then
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version must be X.Y.Z (digits only): $VERSION" >&2
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
              echo "::error::tag v$VERSION already exists" >&2
              exit 1
            fi
            MAX_TAG=$(git tag -l 'v*' | sort -V | tail -n 1)
            if [[ -n "$MAX_TAG" ]]; then
              TOP=$(printf '%s\n%s\n' "${MAX_TAG#v}" "$VERSION" | sort -V | tail -n 1)
              if [[ "$TOP" != "$VERSION" ]]; then
                echo "::error::version $VERSION must be greater than the latest tag $MAX_TAG" >&2
                exit 1
              fi
            fi
            echo "count=1" >> "$GITHUB_OUTPUT"
            echo "bump=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 初回以外は最新タグ以降を調べる。
          if git tag -l | grep -q .; then
            LATEST_TAG=$(git describe --abbrev=0 --tags)
            RANGE="$LATEST_TAG..HEAD"
          else
            RANGE=HEAD
          fi
          # 本文の改行・タブを保持し、コミットはレコード区切りで分ける。
          # breaking を先に検出し、revert:minor の追加規則より優先する。
          read -r COUNT BREAKING < <(
            git log "$RANGE" --format='%B%x1e' --no-merges -P \
              --grep='^(BREAKING CHANGE|build|ci|feat|fix|docs|style|refactor|perf|test|revert|chore)(\(.*\))?!?:|^BREAKING[ -]CHANGE:' \
              | awk 'BEGIN { RS="\036"; count=0; breaking=0 }
                NF {
                  count++
                  sub(/^\n+/, "")
                  n=split($0, lines, "\n")
                  if (lines[1] ~ /^[[:alnum:]_]+(\(.*\))?!:/) breaking=1
                  for (i=1; i<=n; i++)
                    if (lines[i] ~ /^BREAKING[ -]CHANGE:/) breaking=1
                }
                END { print count, breaking }'
          )
          BUMP=""
          if [[ "$LEVEL" != "auto" ]]; then
            BUMP="$LEVEL"
          elif [[ "$BREAKING" == "1" ]]; then
            BUMP=major
          fi
          # 既存の強制実行と初回の件数ゲートを維持する。
          if [[ "$FORCE_BUMP" == "true" || ( "$RANGE" == "HEAD" && "$COUNT" == "0" ) ]]; then
            COUNT=1
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v7.0.0
        with:
          github_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          default_bump: patch
          commit_analyzer_preset: conventionalcommits
          custom_release_rules: revert:minor
          force_bump: ${{ steps.changes.outputs.bump }}
          custom_tag: ${{ inputs.version }}
        if: steps.changes.outputs.count > 0
      - name: Create release notes
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          PREVIOUS_TAG: ${{ steps.tag_version.outputs.previous_tag }}
          NEW_TAG: ${{ steps.tag_version.outputs.new_tag }}
        run: |
          python3 .github/create-release-note-header.py "$SERVER_URL" "$REPOSITORY" "$PREVIOUS_TAG" "$NEW_TAG" > changelog.txt
          git log "$PREVIOUS_TAG..HEAD" --no-merges --format='%H%x1f%s%x1f%b%x1e' \
            | python3 .github/create-release-note-body.py "$SERVER_URL" "$REPOSITORY" >> changelog.txt
        if: steps.changes.outputs.count > 0
      - name: Create a GitHub release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          release_name: Release ${{ steps.tag_version.outputs.new_tag }}
          body_path: changelog.txt
        if: steps.changes.outputs.count > 0
