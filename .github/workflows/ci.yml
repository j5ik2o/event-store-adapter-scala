name: CI
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.scala'
      - '**.java'
      - '**.sbt'
      - '.scalafmt.conf'
      - 'project/build.properties'
      - '.github/workflows/ci.yml'
      - '.github/workflows/bump-version.yml'
      - '.github/create-release-note-header.py'
      - '.github/create-release-note-body.py'
      - '.github/tests/**'
      - 'conformance/**'
      - 'tools/conformance/**'
      - 'api-surface/**'
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 * * * *'
env:
  JAVA_OPTS: -Xms2048M -Xmx2048M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
  JVM_OPTS:  -Xms2048M -Xmx2048M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
  AWS_JAVA_V1_DISABLE_DEPRECATION_ANNOUNCEMENT: true
  AWS_REGION: ap-northeast-1
jobs:
  release-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Test version bump selection
        run: python3 -m unittest discover -s .github/tests -v
      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -shellcheck=
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'
      - name: Verify conformance data
        run: |
          python3 tools/conformance/manifest.py verify
          echo "0157c012042afa9a19f0bff509a433a4bd5ddc5b674de864a41bec453c460691  conformance/manifest.json" | sha256sum -c -
      - name: Verify API surface 0.1.0
        run: echo "37c91f8f94e10c73513a9c1deef990ea4deea96d5001ae700d6bf799658d0e32  api-surface/surface.json" | sha256sum -c -
      - uses: sbt/setup-sbt@v1
      - name: sbt lint
        run: sbt -v lint
  test:
    strategy:
      fail-fast: false
      matrix:
        jdk: [ 11, 17, 19 ]
        scala: [ 2.13.18, 3.6.4 ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    env:
      TEST_TIME_FACTOR: 3
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.jdk }}
          cache: 'sbt'
      - uses: sbt/setup-sbt@v1
      - name: sbt test
        run: sbt -v ++${{ matrix.scala }} test
      - name: Upload conformance report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: conformance-report-jdk${{ matrix.jdk }}-scala${{ matrix.scala }}
          path: |
            target/reports/${{ matrix.scala }}/conformance/report.json
            target/reports/${{ matrix.scala }}/conformance/summary.md
          if-no-files-found: error
      - name: Summarize conformance by rule
        if: ${{ !cancelled() }}
        env:
          REPORT: target/reports/${{ matrix.scala }}/conformance/report.json
          SUMMARY_TITLE: Conformance by rule (JDK ${{ matrix.jdk }} / Scala ${{ matrix.scala }})
        run: |
          python3 - "$REPORT" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, os, re, sys

          with open(sys.argv[1], encoding="utf-8") as f:
              report = json.load(f)

          def natural(rule):
              return [int(p) if p.isdigit() else p for p in re.split(r"(\d+)", rule)]

          def cell(text):
              return text.replace("|", "\\|").replace("\n", " ")

          print("## " + os.environ["SUMMARY_TITLE"] + "\n")
          for backend, statuses in report["backends"].items():
              labels = list(statuses.keys())
              counts = {}
              reasons = {}
              for r in report["rules"]:
                  if r["backend"] != backend:
                      continue
                  row = counts.setdefault(r["rule"], dict.fromkeys(labels, 0))
                  row[r["status"]] += 1
                  if r["status"] in ("not-applicable", "unrepresentable") and r["reason"]:
                      reasons.setdefault(r["rule"], [])
                      if r["reason"] not in reasons[r["rule"]]:
                          reasons[r["rule"]].append(r["reason"])
              print("### " + backend + "\n")
              print("| rule | " + " | ".join(labels) + " | reasons (not-applicable / unrepresentable) |")
              print("|---|" + "---|" * (len(labels) + 1))
              for rule in sorted(counts, key=natural):
                  note = "; ".join(cell(x) for x in reasons.get(rule, []))
                  print("| " + rule + " | " + " | ".join(str(counts[rule][l]) for l in labels) + " | " + note + " |")
              print()
          PY
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [lint, test, release-workflow]
    if: always()
    steps:
      - name: Check CI results
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          RELEASE_WORKFLOW_RESULT: ${{ needs.release-workflow.result }}
        run: |
          if [[ "$LINT_RESULT" != "success" || "$TEST_RESULT" != "success" || "$RELEASE_WORKFLOW_RESULT" != "success" ]]; then
            echo "CI did not succeed: lint=$LINT_RESULT, test=$TEST_RESULT, release-workflow=$RELEASE_WORKFLOW_RESULT"
            exit 1
          fi
